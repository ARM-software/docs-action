name: docs-action-validate
description: GitHub Action for validating Arm documentation sites
inputs:
  docs-root:
    description: Docs root inside the repository. Markdown content lives directly
      under this directory; static/ and docs-config.json are treated specially.
    required: true
  site-id:
    description: Explicit site ID for the docs site.
    required: true
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Set up Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install arm-docs
      shell: bash
      run: |
        ARM_DOCS_PACKAGE_VERSION="$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/../arm-docs-github-action-package-version.txt")"

        echo "::notice::arm-docs-github-action version $ARM_DOCS_PACKAGE_VERSION."

        echo "deb [trusted=yes] https://artifacts.tools.arm.com/tools-deb bionic main" | sudo tee -a /etc/apt/sources.list.d/artifactory.list
        sudo apt-get update
        sudo apt install -y "arm-docs-github-action=$ARM_DOCS_PACKAGE_VERSION"
        sudo rm /etc/apt/sources.list.d/artifactory.list
        sudo apt-get clean

    - name: Run arm-docs validate
      shell: bash
      env:
        INPUT_DOCS_ROOT: ${{ inputs.docs-root }}
        INPUT_SITE_ID: ${{ inputs.site-id }}
      run: |
        command=(arm-docs validate --docs-root "$INPUT_DOCS_ROOT")

        command+=(--site-id "$INPUT_SITE_ID")

        echo "Running command: ${command[*]}" | tee -a "$GITHUB_STEP_SUMMARY"

        "${command[@]}"
